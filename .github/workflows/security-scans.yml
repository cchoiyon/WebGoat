# Ensure 'semgrep_sast_scan' has no leading spaces
semgrep_sast_scan:
  name: Semgrep SAST Scan
  runs-on: ubuntu-latest
  steps:
    # Step 1: Check out the code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Run the Semgrep SAST scan
    - name: Run Semgrep Scan
      # 'run:' must be indented exactly under 'name:'
      run: |
        docker run --rm -v "$(pwd):/src" semgrep/semgrep semgrep scan /src --json -o semgrep-results.json

    # Step 3: Pretty-print the JSON output
    - name: Pretty-print Semgrep JSON
      run: jq . semgrep-results.json

    # Step 4: Upload the JSON report
    - name: Upload Semgrep results
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-results
        path: semgrep-results.json

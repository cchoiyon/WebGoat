semgrep_sast_scan:
  name: Semgrep SAST Scan
  runs-on: ubuntu-latest
  steps:
    # Step 1: Check out the repository's code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Run the Semgrep SAST scan using its official Docker image
    - name: Run Semgrep Scan
      run: |
        docker run --rm -v "$(pwd):/src" semgrep/semgrep semgrep scan /src --json -o semgrep-results.json [cite: 37]

    # Provide a better view of the output in the GitHub logs
    - name: Pretty-print Semgrep JSON
      [cite_start]run: jq . semgrep-results.json [cite: 40]

    # Step 3: Upload the JSON report as a build artifact
    - name: Upload Semgrep results
      [cite_start]uses: actions/upload-artifact@v4 [cite: 44]
      with:
        [cite_start]name: semgrep-results [cite: 46]
        [cite_start]path: semgrep-results.json [cite: 47]
